# schemas/servico.yaml
#id: string;
#nome: string;
#descricao: string;
#categoria: string;
#enabled_at: boolean;
#created_at: string;
#updated_at: string;

componentes:
  schemas:
    # schema principal de servico
    Servico:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Servico de limpeza"
        descricao:
          type: string
          example: " Servico de Limpeza Profissional para residentes"
        categoria:
          type: string
          example: "Limpeza"
        enabled_at:
          type: boolean
          example: true
        created_at:
          type: string
          example: "2010-12-10T00:00:00.000Z"
        updated_at:
          type: string
          example: "2010-12-10T00:00:00.000Z"

    # schemas generico de resposta de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          exemple: "Erro ao buscar servicos"
        Status:
          type: boolean
          example: false
        data:
          type: object
          properties:
            null




