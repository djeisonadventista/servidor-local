# schemas/orcamento.yaml
#id: string,
#total: number,
#id_utilizadores: string,
#enabled: boolean,
#created_at: string,
#updated_at: string,

componentes:
  schemas:
    # schema principal de servico
    Servico:
      type: object
      properties:
        id:
          type: integer
          example: 4
        total:
          type: string
          example: "500"
        id_utilizadores:
          type: string
          example: "a2e25ed1-e1e7-45d6-92cb-d2d8fb342ec0"
        enabled_at:
          type: boolean
          example: true
        created_at:
          type: string
          example: "2010-12-10T00:00:00.000Z"
        updated_at:
          type: string
          example: "2010-12-10T00:00:00.000Z"

    # schemas generico de resposta de erro
    ResponseError:
      type: object
      properties:
        message:
          type: string
          exemple: "Erro ao buscar servicos"
        Status:
          type: boolean
          example: false
        data:
          type: object
          properties:
            null